services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FORGE_ENV: development
      FORGE_HTTP_ADDR: ":8080"
      FORGE_DB_URL: "postgres://forge:forge@postgres:5432/forge?sslmode=disable"
      FORGE_AUTH_MODE: "hmac"
      FORGE_AUTH_HMAC_SECRET: "local-development-secret-change-me"
      FORGE_OTEL_SERVICE_NAME: "forge-control-plane"
      FORGE_RATE_LIMIT_RPS: "50"
      FORGE_RATE_LIMIT_BURST: "100"
    ports:
      - "8080:8080"

  relay:
    build: .
    entrypoint: ["/relay"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      FORGE_ENV: development
      FORGE_DB_URL: "postgres://forge:forge@postgres:5432/forge?sslmode=disable"
      FORGE_NATS_URL: "nats://nats:4222"
      FORGE_EVENTS_STREAM: "FORGE_EVENTS"
      FORGE_EVENTS_SUBJECT_PREFIX: "forge.events"
      FORGE_RELAY_BATCH_SIZE: "100"
      FORGE_RELAY_POLL_INTERVAL: "1s"
      # relay does not authenticate; dummy values satisfy shared config validation
      FORGE_AUTH_MODE: "hmac"
      FORGE_AUTH_HMAC_SECRET: "unused-by-relay"

  consumer:
    build: .
    entrypoint: ["/consumer"]
    depends_on:
      nats:
        condition: service_healthy
    environment:
      FORGE_ENV: development
      FORGE_DB_URL: "postgres://forge:forge@postgres:5432/forge?sslmode=disable"
      FORGE_NATS_URL: "nats://nats:4222"
      FORGE_EVENTS_STREAM: "FORGE_EVENTS"
      FORGE_EVENTS_SUBJECT_PREFIX: "forge.events"
      FORGE_AUTH_MODE: "hmac"
      FORGE_AUTH_HMAC_SECRET: "unused-by-consumer"

volumes:
  pgdata: {}
