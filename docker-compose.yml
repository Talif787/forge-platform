services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FORGE_ENV: development
      FORGE_HTTP_ADDR: ":8080"
      FORGE_DB_URL: "postgres://forge:forge@postgres:5432/forge?sslmode=disable"
      FORGE_AUTH_MODE: "hmac"
      FORGE_AUTH_HMAC_SECRET: "local-development-secret-change-me"
      FORGE_OTEL_SERVICE_NAME: "forge-control-plane"
      FORGE_RATE_LIMIT_RPS: "50"
      FORGE_RATE_LIMIT_BURST: "100"
    ports:
      - "8080:8080"

volumes:
  pgdata: {}
