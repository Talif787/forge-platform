name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit, application, and API tests
        run: go test -race -count=1 ./...

      - name: Integration tests (testcontainers)
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test -race -count=1 -tags=integration ./internal/modules/catalog/adapters/postgres/... ./internal/relay/...
