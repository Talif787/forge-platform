apiVersion: platform.forge.dev/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: default
spec:
  image: nginxinc/nginx-unprivileged:stable
  port: 8080
  replicas: 2
  tier: 3
  expose: true
  # nginx writes temp dirs at startup, so this image opts out of the read-only
  # root filesystem. All other hardening defaults (non-root, no privilege
  # escalation, dropped capabilities) still apply.
  security:
    readOnlyRootFilesystem: false
